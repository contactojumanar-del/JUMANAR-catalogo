<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JUMANAR — Cotizador</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js" onerror="window.__exceljsFailed=true;"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  /* --- JUMANAR · Identidad Visual V2.6 ---
     Verde Institucional #1F4D4D · Verde Salvia #A7B897 · Beige Cálido #DCCDBA
     Crema #F6F3EC · Gris Topo #7B7062 · Arena #E9E1D6
     (nombres de variable heredados del sistema anterior; solo se remapean los valores) */
  --walnut-900:#1F4D4D;   /* Verde Institucional — sidebar, marca */
  --walnut-800:#2A5C5C;   /* Verde Institucional, tono claro (degradado sidebar) */
  --walnut-700:#3B6B6B;   /* Verde Institucional, tono más claro aún */
  --sawdust-100:#F6F3EC;  /* Crema — fondo principal */
  --sawdust-50:#FBFAF6;   /* Crema, variante más clara */
  --paper-0:#FFFFFF;      /* tarjetas */
  --blueprint-600:#1F4D4D; /* Verde Institucional — acción primaria */
  --blueprint-700:#173D3D; /* Verde Institucional, hover */
  --blueprint-100:#E4ECEA; /* Verde Institucional, tinte muy claro */
  --brass-500:#A7B897;    /* Verde Salvia — acción secundaria */
  --brass-100:#EEF1E8;    /* Verde Salvia, tinte muy claro */
  --forest-600:#1F4D4D;   /* Verde Institucional — estados positivos */
  --forest-100:#E4ECEA;
  --rust-600:#9C5B45;     /* Terracota apagada — alertas (no está en la paleta oficial; ver nota de diseño) */
  --rust-100:#F3E4DC;
  --ink-900:#20302D;      /* texto principal, verde-negro cálido */
  --ink-600:#7B7062;      /* Gris Topo — texto secundario oficial */
  --line:#E3DACB;         /* línea divisoria, entre Beige Cálido y Arena */
  --arena:#E9E1D6;        /* Arena — fondos alternos */
  --beige:#DCCDBA;        /* Beige Cálido — fondos suaves */
  --radius:10px;
  --shadow:0 1px 2px rgba(31,77,77,.07), 0 4px 14px rgba(31,77,77,.07);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Jost',system-ui,sans-serif;
  font-weight:400;
  background:var(--sawdust-100);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace;}
.disp{font-family:'Jost',sans-serif;}

#shell{display:flex; min-height:100vh;}

/* ---------- SIDEBAR ---------- */
#sidebar{
  width:230px; flex-shrink:0;
  background:linear-gradient(180deg,var(--walnut-900),var(--walnut-800));
  color:var(--sawdust-50);
  padding:22px 14px;
  display:flex; flex-direction:column; gap:4px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding:0 8px 20px 8px; margin-bottom:8px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.brand-mark{
  width:34px;height:34px;border-radius:8px;
  background:var(--sawdust-100);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand-name{font-family:'Jost',sans-serif; font-weight:600; font-size:15px; line-height:1.15; letter-spacing:.08em; text-transform:uppercase;}
.brand-sub{font-size:10.5px; color:rgba(255,255,255,.55); letter-spacing:.04em; text-transform:uppercase;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:8px; cursor:pointer;
  font-size:13.5px; font-weight:500; color:rgba(255,255,255,.75);
  transition:background .12s, color .12s;
  user-select:none;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--brass-500); color:var(--walnut-900); font-weight:600;}
.nav-icon{width:18px; text-align:center; font-size:14px;}
.nav-sep{height:1px; background:rgba(255,255,255,.08); margin:10px 4px;}
.nav-foot{margin-top:auto; padding:10px 8px 0 8px; font-size:10.5px; color:rgba(255,255,255,.4); border-top:1px solid rgba(255,255,255,.08);}

/* ---------- MAIN ---------- */
#main{flex:1; min-width:0; padding:26px 32px 60px 32px;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; gap:16px; flex-wrap:wrap;}
.page-title{font-family:'Jost',sans-serif; font-size:24px; font-weight:600; letter-spacing:.02em; margin:0;}
.page-sub{color:var(--ink-600); font-size:13px; margin-top:3px;}

.btn{
  border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600;
  cursor:pointer; font-family:'Jost',sans-serif; display:inline-flex; align-items:center; gap:7px;
  transition:transform .06s, box-shadow .12s; white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blueprint-600); color:#fff;}
.btn-primary:hover{background:var(--blueprint-700);}
.btn-brass{background:var(--brass-500); color:var(--walnut-900);}
.btn-brass:hover{filter:brightness(1.05);}
.btn-ghost{background:var(--paper-0); color:var(--ink-900); border:1px solid var(--line);}
.btn-ghost:hover{background:var(--sawdust-50);}
.btn-danger{background:var(--rust-100); color:var(--rust-600);}
.btn-danger:hover{background:#eccbc2;}
.btn-sm{padding:6px 11px; font-size:12px;}
.btn-icon{width:30px;height:30px;padding:0;justify-content:center;}

.card{background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.pad{padding:18px 20px;}

/* KPI */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:24px;}
.kpi{padding:16px 18px; position:relative; overflow:hidden;}
.kpi-label{font-size:11.5px; color:var(--ink-600); text-transform:uppercase; letter-spacing:.05em; font-weight:600;}
.kpi-value{font-family:'Jost',sans-serif; font-size:26px; font-weight:700; margin-top:6px;}
.kpi-accent{position:absolute; left:0; top:0; bottom:0; width:4px;}

/* Tables */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-600); font-weight:600; padding:9px 10px; border-bottom:2px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.row-hover:hover{background:var(--sawdust-50);}
.table-wrap{overflow-x:auto;}

input[type=text], input[type=number], input[type=date], input[type=tel], input[type=email], select, textarea{
  font-family:'Jost',sans-serif; font-size:13.5px; padding:8px 10px; border:1px solid var(--line);
  border-radius:7px; background:#fff; color:var(--ink-900); width:100%;
}
textarea{font-family:'Jost',sans-serif; resize:vertical;}
input:focus, select:focus, textarea:focus{outline:2px solid var(--blueprint-600); outline-offset:1px; border-color:var(--blueprint-600);}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.field label{font-size:11.5px; font-weight:600; color:var(--ink-600); text-transform:uppercase; letter-spacing:.03em;}
.row-flex{display:flex; gap:12px; flex-wrap:wrap;}
.row-flex > .field{flex:1; min-width:160px;}

/* tag / label - signature element (shop traveler tag) */
.shop-tag{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--walnut-900); color:var(--sawdust-50);
  padding:4px 10px 4px 8px; border-radius:4px 10px 10px 4px;
  font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:500; letter-spacing:.02em;
}
.shop-tag::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--brass-500); flex-shrink:0;}

.badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600;}
.badge-pend{background:var(--brass-100); color:#5C6B4E;}
.badge-prod{background:var(--blueprint-100); color:var(--blueprint-700);}
.badge-ok{background:var(--forest-100); color:var(--forest-600);}
.badge-cancel{background:var(--rust-100); color:var(--rust-600);}
.badge-quote{background:var(--arena); color:var(--ink-600);}

.section-title{font-family:'Jost',sans-serif; font-weight:600; font-size:15px; letter-spacing:.02em; margin:0 0 12px 0; display:flex; align-items:center; justify-content:space-between;}

.mat-table input{padding:6px 8px; font-size:13px;}
.mat-table td{padding:5px 6px;}
.mat-table th{padding:6px;}
.mat-total-cell{font-family:'JetBrains Mono',monospace; font-weight:600; white-space:nowrap;}

.summary-box{background:var(--blueprint-100); border-radius:var(--radius); padding:16px 18px;}
.summary-row{display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px;}
.summary-row.total{border-top:1.5px dashed var(--blueprint-700); margin-top:6px; padding-top:10px; font-weight:700; font-size:16px; font-family:'Jost',sans-serif;}
.summary-row .val{font-family:'JetBrains Mono',monospace;}

.pill-toggle{display:flex; background:var(--sawdust-50); border-radius:8px; padding:3px; border:1px solid var(--line); width:fit-content;}
.pill-toggle .opt{padding:6px 14px; font-size:12.5px; font-weight:600; border-radius:6px; cursor:pointer; color:var(--ink-600);}
.pill-toggle .opt.active{background:var(--blueprint-600); color:#fff;}

.empty-state{text-align:center; padding:50px 20px; color:var(--ink-600);}
.empty-state .em-icon{font-size:34px; margin-bottom:10px;}

.searchbox{position:relative;}
.searchbox input{padding-left:32px;}
.searchbox::before{content:'🔍'; position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:12px; opacity:.5;}

.autocomplete-list{position:absolute; z-index:20; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); width:100%; max-height:220px; overflow-y:auto; margin-top:4px;}
.ac-item{padding:9px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--sawdust-100);}
.ac-item:hover{background:var(--sawdust-50);}
.ac-item .ac-sub{font-size:11px; color:var(--ink-600);}
.ac-new{color:var(--blueprint-600); font-weight:600;}

.chosen-chip{display:flex; align-items:center; justify-content:space-between; background:var(--forest-100); padding:9px 12px; border-radius:8px; font-size:13.5px;}
.chosen-chip .x{cursor:pointer; color:var(--rust-600); font-weight:700; padding:0 4px;}

.grid-2col{display:grid; grid-template-columns:1.4fr 1fr; gap:20px;}
@media (max-width:980px){.grid-2col{grid-template-columns:1fr;}}

.model-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px;}
.model-card{cursor:pointer; overflow:hidden;}
.model-card img, .model-card .noimg{width:100%; height:110px; object-fit:cover; background:var(--sawdust-100); display:flex; align-items:center; justify-content:center; color:var(--ink-600); font-size:26px;}
.model-card .mc-body{padding:10px 12px;}
.model-card .mc-code{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-600);}
.model-card .mc-name{font-weight:600; font-size:13.5px; margin-top:2px;}

.modal-bg{position:fixed; inset:0; background:rgba(36,24,17,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:#fff; border-radius:14px; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; padding:24px;}
.modal.modal-wide{max-width:880px;}
.modal h3{font-family:'Jost',sans-serif; margin-top:0;}
.modal-close-row{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

.wa-box{background:var(--forest-100); border-radius:var(--radius); padding:16px;}
.wa-box textarea{min-height:170px; background:#fff;}

.tab-strip{display:flex; gap:4px; border-bottom:2px solid var(--line); margin-bottom:18px;}
.tab-strip .tb{padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-600); border-bottom:2px solid transparent; margin-bottom:-2px;}
.tab-strip .tb.active{color:var(--blueprint-700); border-color:var(--blueprint-600);}

.icon-btn-row{display:flex; gap:6px;}
.small-muted{font-size:11.5px; color:var(--ink-600);}
.divider{height:1px; background:var(--line); margin:16px 0;}
.link-btn{background:none;border:none;color:var(--blueprint-600); font-weight:600; cursor:pointer; font-size:13px; padding:0;}
.link-btn:hover{text-decoration:underline;}
::placeholder{color:#b6a892;}

@media print{
  #sidebar, .page-head .btn, .btn, .icon-btn-row, #wa-container, .modal-bg, #toast-box, #save-banner, .nav-item, .nav-sep, .nav-foot { display:none !important; }
  #shell { display:block !important; }
  #main { padding:0 !important; }
  body { background:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .doc { width:100% !important; max-width:100% !important; padding:10px 14px !important; font-size:11px !important; }
  .doc-head { padding-bottom:8px !important; margin-bottom:10px !important; }
  .doc-brand { font-size:16px !important; }
  .doc-section-title { padding:3px 8px !important; margin:8px 0 5px 0 !important; font-size:10px !important; }
  .doc-block { font-size:10.5px !important; }
  .doc table.doc-items th, .doc table.doc-items td { padding:4px 6px !important; font-size:10px !important; }
  .doc .doc-totals { font-size:11px !important; }
  .doc .doc-legal { font-size:8.5px !important; }
  .doc .doc-sign { margin-top:18px !important; }
  .doc .doc-foot { margin-top:10px !important; padding-top:6px !important; font-size:9px !important; }
  .card, .pad { box-shadow:none !important; border:none !important; }
  @page { size:letter portrait; margin:12mm 14mm; }
}
</style>
</head>
<body>
<div id="shell">
  <div id="sidebar"></div>
  <div id="main"></div>
</div>

<script>
/* =========================================================================
   STATE + PERSISTENCE
   ========================================================================= */
let DB = {
  clients: [], models: [], quotes: [], productionOrders: [],
  counters: { quote: 0, op: 0, cc: 0 },
  config: { moneda: 'COP', co2Factor: 0.00008, wearFactor: 0.05 },
  fixedCosts: null,
  empresa: null,
  materialTemplates: [],
};
function defaultEmpresa(){
  return {
    razonSocial: 'JUMANAR',
    tagline: 'Taller de Diseño y Fabricación de Mobiliario',
    fraseMarca: '"Si es parte de tu hogar, merece un lugar."',
    representantes: 'Rosa Milena Narváez Ortiz · Byron Javier Narváez Ortiz',
    nit: '',
    direccion: 'Bogotá, D.C., Colombia',
    ciudad: 'Bogotá, D.C.',
    telefono: '310 769 5567',
    correoWeb: 'contacto@jumanar.cc · www.jumanar.cc',
    validezDiasCotizacion: 15,
    anticipoPorcentaje: 0.5,
    formaPagoTexto: '50% anticipo · 50% contra entrega',
    medioPagoTexto: 'Transferencia / Consignación bancaria',
    personalizacionTexto: 'Dimensiones, tapizado y madera a elección del cliente',
    garantiaTexto: '1 año contra defectos de fabricación en estructuras, ensambles y acabados',
    modeloProductivoTexto: 'Made-to-Order — fabricación exclusiva bajo pedido, sin inventario en stock',
    banco: '',
    tipoCuenta: 'Ahorros',
    numeroCuenta: '',
    titularCuenta: '',
    medioPagoCCTexto: 'Transferencia / Consignación / WhatsApp Business',
    prefijoCot: 'COT',
    prefijoCC: 'CC',
    prefijoOP: 'OP',
    numeroCotInicial: 1,
  };
}
function defaultFixedCosts(){
  const wk = 4;
  function fila(concepto, valores, tipoContrato){
    const arr = Array.isArray(valores) ? valores.slice(0,wk) : Array(wk).fill(valores);
    while(arr.length < wk) arr.push(arr.length ? arr[arr.length-1] : 0);
    return {id:uid(), concepto, tipoContrato: tipoContrato||'gasto', valoresSemanales: arr};
  }
  return {
    weeksPerMonth: wk,
    partners: 2,
    rows: [
      fila('ARRIENDO', 550000),
      fila('JAIRO', 500000),
      fila('JORGE', 650000),
      fila('CARLOS', 600000),
      fila('CONTADOR', 150000),
      fila('AGUA', 52500),
      fila('LUZ', 140000),
      fila('PROGRAMA SANA', 12750),
      fila('SEGURIDAD SOCIAL (35% de 810.000)', 70750),
      fila('DOTACIÓN', 10000),
      fila('LUIS', [0,0,0,0], 'individual'),
      fila('SEG. SOCIAL LUIS', 67500),
    ]
  };
}
let VIEW = { name: 'dashboard', params: {} };
let DRAFT = null; // in-progress quote being edited in Cotizador
let PENDING_DRAFT = null; // a freshly-built draft waiting to be picked up by viewCotizador
let saveTimer = null;
const DOMAIN_KEYS = ['clients','models','quotes','productionOrders','counters','config','fixedCosts','empresa','materialTemplates'];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* =========================================================================
   STORAGE ADAPTER — Supabase (primario) + localStorage (fallback offline)
   Solo se reemplaza este bloque. El resto de la app (loadDB, persist,
   render, vistas, cálculos) queda 100% intacto.
   Interfaz conservada: storage.get(key) / storage.set(key,value) /
                        storage.delete(key) / storage.list(prefix)
   ========================================================================= */
const SUPABASE_URL = 'https://gjoweghtozjsdymwqtpw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dXX44x9IzqzYbKwvgr7LpQ_Pl4ax-oM';
const SB_TABLE     = 'jumanar_store';

// — localStorage como caché offline —————————————————————————————————————
const _lsCache = (function(){
  let ok = false;
  try{ localStorage.setItem('__jum_t','1'); localStorage.removeItem('__jum_t'); ok=true; }catch(e){}
  return {
    get:  k => ok ? localStorage.getItem('jum_'+k) : null,
    set:  (k,v) => { try{ if(ok) localStorage.setItem('jum_'+k, v); }catch(e){} },
    del:  k => { try{ if(ok) localStorage.removeItem('jum_'+k); }catch(e){} },
    keys: prefix => {
      if(!ok) return [];
      const out = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith('jum_'+(prefix||''))) out.push(k.replace('jum_',''));
      }
      return out;
    }
  };
})();

// — Supabase REST helpers ————————————————————————————————————————————————
async function _sbFetch(method, body, params){
  const url = new URL(`${SUPABASE_URL}/rest/v1/${SB_TABLE}`);
  if(params) Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url.toString(), {
    method,
    headers: {
      'apikey':        SUPABASE_KEY,
      'Authorization': 'Bearer '+SUPABASE_KEY,
      'Content-Type':  'application/json',
      'Prefer':        method==='POST' ? 'resolution=merge-duplicates,return=representation' : 'return=representation',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if(!res.ok){
    const txt = await res.text().catch(()=>'');
    throw new Error(`Supabase ${method} ${res.status}: ${txt}`);
  }
  return res.status===204 ? [] : res.json();
}

// — Adaptador principal ——————————————————————————————————————————————————
const storage = {
  get: async (key) => {
    try{
      const rows = await _sbFetch('GET', null, { select:'key,value', key:'eq.'+key });
      if(!rows || rows.length===0){
        // intentar caché local
        const cached = _lsCache.get(key);
        if(cached!==null) return {key, value: cached};
        throw new Error('not_found');
      }
      _lsCache.set(key, rows[0].value);   // actualizar caché local
      return {key, value: rows[0].value};
    }catch(e){
      if(e.message==='not_found') throw e;
      // error de red — usar caché local
      const cached = _lsCache.get(key);
      if(cached!==null) return {key, value: cached};
      throw new Error('not_found');
    }
  },

  set: async (key, value) => {
    _lsCache.set(key, value);             // guardar siempre en local primero
    try{
      await _sbFetch('POST', {key, value, updated_at: new Date().toISOString()});
      return {key, value};
    }catch(e){
      console.warn('Supabase set error (datos en caché local):', e.message);
      // No lanzamos error — el dato quedó en localStorage y se sincronizará
      return {key, value};
    }
  },

  delete: async (key) => {
    _lsCache.del(key);
    try{
      await _sbFetch('DELETE', null, { key:'eq.'+key });
    }catch(e){
      console.warn('Supabase delete error:', e.message);
    }
    return {key, deleted: true};
  },

  list: async (prefix='') => {
    try{
      const rows = await _sbFetch('GET', null,
        prefix ? { select:'key', key:`like.${prefix}*` } : { select:'key' }
      );
      return {keys: (rows||[]).map(r=>r.key)};
    }catch(e){
      // fallback a caché local
      return {keys: _lsCache.keys(prefix)};
    }
  },
};


async function loadDB(){
  let migratedFromLegacy = false;
  try{
    const legacy = await storage.get('db');
    if(legacy && legacy.value){
      const parsed = JSON.parse(legacy.value);
      DB = Object.assign(DB, parsed);
      migratedFromLegacy = true;
    }
  }catch(e){ /* no legacy blob */ }

  if(!migratedFromLegacy){
    for(const k of DOMAIN_KEYS){
      try{
        const res = await storage.get(k);
        if(res && res.value) DB[k] = JSON.parse(res.value);
      }catch(e){ /* key not created yet */ }
    }
  }

  if(!DB.fixedCosts || !DB.fixedCosts.rows){ DB.fixedCosts = defaultFixedCosts(); persist(); }
  if(!DB.empresa){ DB.empresa = defaultEmpresa(); persist(); }
  if(!DB.materialTemplates){ DB.materialTemplates = []; persist(); }
  migrateProductionStates();
  migrateCostosAdicionalesToMateriales();
  migrateFixedCostsToWeekly();
  migrateEmpresaFixes();
  migrateQuotesToProductos();

  if(migratedFromLegacy){
    await persistAllNow();
    try{ await storage.delete('db'); }catch(e){ /* best effort */ }
  }
  render();
}

function migrateCostosAdicionalesToMateriales(){
  let changed = false;
  (DB.quotes||[]).forEach(q=>{
    if(Array.isArray(q.costosAdicionales) && q.costosAdicionales.length>0){
      q.materiales = q.materiales || [];
      q.costosAdicionales.forEach(c=>{
        const valor = Number(c.valor)||0;
        if((c.concepto && c.concepto.trim()!=='') || valor!==0){
          q.materiales.push({id: uid(), material: c.concepto||'', cantidad:1, unidad:'', costoUnitario: valor});
        }
      });
      q.costosAdicionales = [];
      changed = true;
    }
  });
  if(changed) persist();
}
function ensureRowWeeks(row, wk){
  if(!Array.isArray(row.valoresSemanales)) row.valoresSemanales = [];
  const arr = row.valoresSemanales;
  while(arr.length < wk){ arr.push(arr.length ? arr[arr.length-1] : 0); }
  if(arr.length > wk) arr.length = wk;
  return arr;
}
function migrateFixedCostsToWeekly(){
  const fc = DB.fixedCosts;
  if(!fc || !Array.isArray(fc.rows)) return;
  const wk = Number(fc.weeksPerMonth)||4;
  let changed = false;
  fc.rows.forEach(r=>{
    if(!Array.isArray(r.valoresSemanales)){
      const avg = ((Number(r.alto)||0)+(Number(r.medio)||0)+(Number(r.bajo)||0))/3;
      const weekly = r.semanal ? avg : (avg/wk);
      r.valoresSemanales = Array(wk).fill(Math.round(weekly));
      delete r.alto; delete r.medio; delete r.bajo; delete r.semanal;
      changed = true;
    } else {
      ensureRowWeeks(r, wk);
    }
    // Migración del antiguo campo "persona" (texto libre) al nuevo "tipoContrato" (Individual/Gasto)
    if(r.tipoContrato===undefined){
      r.tipoContrato = (r.persona && r.persona.trim()!=='') ? 'individual' : 'gasto';
      changed = true;
    }
    if(r.persona!==undefined){ delete r.persona; changed = true; }
  });
  if(changed) persist();
}
function contratistaWeeklyTotal(nombre, weekNum){
  const n = (nombre||'').trim().toLowerCase();
  if(!n) return 0;
  let total = 0;
  DB.quotes.forEach(q=>{
    (q.productos||[]).forEach(p=>{
      if((p.contratista||'').trim().toLowerCase()===n && Number(p.contratistaSemana)===weekNum){
        total += Number(p.contratistaValor)||0;
      }
    });
  });
  return total;
}
function rowWeeklyValue(r, weekIndex, wk){
  if(r.tipoContrato==='individual'){
    return contratistaWeeklyTotal(r.concepto, weekIndex+1);
  }
  ensureRowWeeks(r, wk);
  return Number(r.valoresSemanales[weekIndex])||0;
}
function getContratistaNombres(){

function migrateQuotesToProductos(){
  let changed = false;
  (DB.quotes||[]).forEach(q=>{
    if(!Array.isArray(q.productos)){
      let precioUnitario = 0;
      const cantOriginal = Number(q.cantidad)||1;
      if(q.modoPrecio==='manual'){
        precioUnitario = (Number(q.precioManual)||0) / cantOriginal;
      } else {
        const totalMateriales = (q.materiales||[]).reduce((s,m)=> s + (Number(m.cantidad)||0)*(Number(m.costoUnitario)||0), 0);
        precioUnitario = totalMateriales * (Number(q.multiplicador)||1);
      }
      q.productos = [{
        id: uid(),
        nombre: q.producto || '',
        referencia: q.codigoProducto || '',
        medidas: q.medidas || '',
        cantidad: cantOriginal,
        precioUnitario: precioUnitario,
        contratista: q.contratista || '',
        contratistaSemana: q.contratistaSemana || 1,
        contratistaValor: q.contratistaValor || 0,
        estadoPagoContratista: 'pendiente',
      }];
      if(q.modoPrecio!=='manual') q.modoPrecio = 'productos';
      delete q.producto; delete q.codigoProducto; delete q.cantidad; delete q.medidas;
      delete q.contratista; delete q.contratistaSemana; delete q.contratistaValor;
      changed = true;
    }
  });
  if(changed) persist();
}
async function persistAllNow(){
  for(const k of DOMAIN_KEYS){
    await persistKeyWithRetry(k);
  }
}
async function persistKeyWithRetry(k, maxRetries){
  maxRetries = maxRetries===undefined ? 3 : maxRetries;
  for(let attempt=0; attempt<=maxRetries; attempt++){
    try{
      const result = await storage.set(k, JSON.stringify(DB[k]));
      if(result) return true;
      throw new Error('sin confirmación');
    }catch(e){
      if(attempt===maxRetries){
        console.error('Error guardando '+k, e);
        return false;
      }
      const delay = 300*(attempt+1) + Math.random()*200;
      await new Promise(res=>setTimeout(res, delay));
    }
  }
  return false;
}
let autoRetryTimer = null;
let autoRetryCount = 0;
function showSaveBanner(failedKeys){
  let b = document.getElementById('save-banner');
  if(!b){

    b.id = 'save-banner';
    b.style.cssText = 'position:fixed; bottom:0; left:0; right:0; background:var(--rust-600); color:#fff; padding:10px 16px; font-size:13px; z-index:300; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; text-align:center;';
    document.body.appendChild(b);
  }
  b.innerHTML = `<span>⚠ No se pudieron guardar algunos cambios en el servidor. Tus datos siguen visibles aquí, pero no se han sincronizado todavía.</span>
    <button class="btn btn-sm" style="background:#fff; color:var(--rust-600); border:none; border-radius:8px; padding:6px 11px; font-weight:600; cursor:pointer;" onclick="retrySaveNow()">Reintentar ahora</button>`;
}
function hideSaveBanner(){
  const b = document.getElementById('save-banner');
  if(b) b.remove();
  autoRetryCount = 0;
  clearTimeout(autoRetryTimer);
}
function retrySaveNow(){
  clearTimeout(autoRetryTimer);
  persist(true);
}
function persist(immediate){
  clearTimeout(saveTimer);
  const run = async ()=>{
    const failed = [];
    for(const k of DOMAIN_KEYS){
      const ok = await persistKeyWithRetry(k);
      if(!ok) failed.push(k);
    }
    if(failed.length>0){
      showSaveBanner(failed);
      autoRetryCount++;
      if(autoRetryCount <= 6){
        autoRetryTimer = setTimeout(()=>persist(true), 6000 + Math.random()*3000);
      }
    } else {
      hideSaveBanner();
    }
  };
  if(immediate){ run(); }
  else { saveTimer = setTimeout(run, 250); }
}

function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){
  n = Number(n)||0;

  catch(e){ return DB.config.moneda + ' ' + n.toFixed(0); }
}
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function quoteProductSummary(q){
  const items = (q.productos||[]).filter(p=> (p.nombre||'').trim()!=='');
  if(items.length===0) return '(sin productos)';
  if(items.length===1) return items[0].nombre;
  return items.map(p=>p.nombre).join(' + ');
}

function calcQuote(q){
  const items = (q.productos && q.productos.length>0) ? q.productos : [];
  const cantidad = items.reduce((s,p)=> s + (Number(p.cantidad)||0), 0) || 1;
  const totalMateriales = (q.materiales||[]).reduce((s,m)=> s + (Number(m.cantidad)||0)*(Number(m.costoUnitario)||0), 0);
  const costoUnitario = totalMateriales;
  const manoObra = (q.materiales||[]).find(m=> (m.material||'').toLowerCase().includes('mano de obra'));
  const manoObraValor = manoObra ? (Number(manoObra.cantidad)||0)*(Number(manoObra.costoUnitario)||0) : 0;

  const totalProductos = items.reduce((s,p)=> s + (Number(p.cantidad)||0)*(Number(p.precioUnitario)||0), 0);

  let precioVentaPedido;
  if(q.modoPrecio === 'manual'){
    precioVentaPedido = Number(q.precioManual)||0;
  } else if(q.modoPrecio === 'productos'){
    precioVentaPedido = totalProductos;
  } else {
    precioVentaPedido = costoUnitario * (Number(q.multiplicador)||1);
  }
  const precioVentaUnitario = cantidad>0 ? precioVentaPedido/cantidad : precioVentaPedido;

  const costoTotalPedido = costoUnitario;
  const co2 = costoTotalPedido * (DB.config.co2Factor||0);
  const desgaste = manoObraValor * (DB.config.wearFactor||0);
  const utilidadPedido = precioVentaPedido - costoTotalPedido;
  const margen = precioVentaPedido>0 ? (utilidadPedido/precioVentaPedido*100) : 0;
  const abonoSugerido = precioVentaPedido * 0.5;

  return {
    cantidad,
    totalMateriales, totalProductos,
    costoUnitario, precioVentaUnitario,
    co2, desgaste,
    costoTotal: costoTotalPedido,
    precioVenta: precioVentaPedido,
    utilidad: utilidadPedido,
    margen,
    abonoSugerido,
    items
  };
}

function saldoPendiente(q){
  if(q.estado !== 'vendida' || !q.venta) return 0;
  const calc = calcQuote(q);
  return Math.max(0, calc.precioVenta - (Number(q.venta.anticipo)||0));
}

function numeroALetras(num){
  num = Math.round(Number(num)||0);
  if(num===0) return 'CERO PESOS M/CTE';
  const UNI=['', 'un','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez',
    'once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte'];
  const DEC=['veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const CEN=['ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  function grupo(n){
    if(n===100) return 'cien';
    const c = Math.floor(n/100), r = n%100;
    let out = c>0 ? CEN[c-1] : '';
    if(r>0){
      if(out) out += ' ';
      if(r<=20) out += UNI[r];
      else{
        const d=Math.floor(r/10), u=r%10;
        if(u===0) out += DEC[d-2];
        else if(d===2) out += 'veinti'+UNI[u];
        else out += DEC[d-2]+' y '+UNI[u];
      }
    }
    return out.trim();
  }
  const millones = Math.floor(num/1000000);
  const miles = Math.floor((num%1000000)/1000);
  const cientos = num%1000;
  let partes = [];
  if(millones>0) partes.push(millones===1 ? 'un millón' : grupo(millones)+' millones');
  if(miles>0) partes.push(miles===1 ? 'mil' : grupo(miles)+' mil');
  if(cientos>0) partes.push(grupo(cientos));
  let texto = partes.join(' ').trim();
  texto = texto.charAt(0).toUpperCase()+texto.slice(1);
  return (texto+' PESOS M/CTE').toUpperCase();
}
function addDays(dateStr, days){
  const d = new Date((dateStr||todayStr())+'T00:00:00');
  d.setDate(d.getDate()+(Number(days)||0));
  return d.toISOString().slice(0,10);
}

  // "COT-000002" -> "JUM-COT-000002"; falls back gracefully if numero is missing
  return 'JUM-' + (numero || (prefix+'-000000'));

function docHtmlToWordCompatible(bodyHtml){
  // Word entiende flexbox/grid muy mal. Convertimos los contenedores clave a <table>
  // simples (que Word sí respeta) usando el mismo HTML que ya generamos, con un
  // reemplazo ligero de estructura para las secciones de dos columnas.
  let html = '<div class="doc-topbar"></div><div class="doc-topbar-accent"></div>' + bodyHtml;
  // doc-meta: convertir los 4 <div> hijos en celdas de una fila de tabla
  html = html.replace(/<div class="doc-meta">([\s\S]*?)<\/div>\s*<div class="doc-section-title">/,
    (m, inner)=>{
      const cells = [...inner.matchAll(/<div>([\s\S]*?)<\/div>/g)].map(x=>`<td>${x[1]}</td>`).join('');
      return `<table class="doc-meta"><tr>${cells}</tr></table><div class="doc-section-title">`;
    });
  return html;
}
function downloadDocWord(bodyHtml, filename){
  const preparedBody = docHtmlToWordCompatible(bodyHtml);
  const fullHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset='utf-8'><title>${esc(filename)}</title>
  <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->
  ${docStylesForWord()}
  </head>
  <body>${preparedBody}</body>
  </html>`;
  const blob = new Blob(['\ufeff', fullHtml], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('Word descargado.');
}

  const ventasMes = DB.quotes.filter(q=>q.estado==='vendida' && q.venta && q.venta.fecha && q.venta.fecha.startsWith(ym));
  const totalVentasMes = ventasMes.reduce((s,q)=> s+calcQuote(q).precioVenta, 0);

function estadoBadge(q){
  if(q.estado==='cotizacion') return `<span class="badge badge-quote">Cotización</span>`;
  if(q.estado==='cancelada') return `<span class="badge badge-cancel">Cancelada</span>`;
  const op = DB.productionOrders.find(o=>o.quoteId===q.id);
  if(op) return `<span class="badge ${opBadgeClass(op.estado)}">${OP_LABELS[op.estado]}</span>`;
  return `<span class="badge badge-ok">Vendida</span>`;
}
function renderAgendaMini(){
  const list = DB.productionOrders.filter(o=> !['entregado'].includes(o.estado) && o.fechaEntregaEstimada)
    .sort((a,b)=> a.fechaEntregaEstimada.localeCompare(b.fechaEntregaEstimada)).slice(0,6);
  if(list.length===0) return emptyState('▨','No hay entregas programadas.');
  return list.map(o=>{
    const q = getQuote(o.quoteId); const c = q?getClient(q.clienteId):null;
    const d = daysBetween(todayStr(), o.fechaEntregaEstimada);
    let tag = d<0 ? `<span class="badge badge-cancel">Atrasada ${Math.abs(d)}d</span>` : d===0 ? `<span class="badge badge-pend">Hoy</span>` : `<span class="badge badge-prod">En ${d}d</span>`;
    return `<div style="display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line);">
      <div><div style="font-weight:600; font-size:13.5px;">${esc(c?c.nombre:'—')}</div><div class="small-muted">${esc(q?quoteProductSummary(q):'')} · ${fmtDate(o.fechaEntregaEstimada)}</div></div>
      ${tag}</div>`;
  }).join('');
}
function emptyState(icon, msg){ return `<div class="empty-state"><div class="em-icon">${icon}</div><div>${msg}</div></div>`; }

function showModal(innerHtml, extraClass){
  let bg = document.getElementById('modal-bg');
  if(!bg){ bg = document.createElement('div'); bg.id='modal-bg'; bg.className='modal-bg'; document.body.appendChild(bg); }
  bg.innerHTML = `<div class="modal ${extraClass||''}">${innerHtml}</div>`;
  bg.onclick = (e)=>{ if(e.target===bg) closeModal(); };
}
function closeModal(){ const bg = document.getElementById('modal-bg'); if(bg) bg.remove(); }
function showConfirm(message, onYes){
  showModal(`<h3>Confirmar</h3><p style="font-size:14px; color:var(--ink-600);">${esc(message)}</p>
    <div class="modal-close-row">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confirm-yes-btn">Sí, continuar</button>
    </div>`);
  document.getElementById('confirm-yes-btn').onclick = ()=>{ closeModal(); onYes(); };
}
function toast(message, onClick){
  let t = document.getElementById('toast-box');
  if(!t){
    t = document.createElement('div'); t.id='toast-box';
    t.style.cssText = 'position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--walnut-900);color:#fff;padding:11px 20px;border-radius:8px;z-index:200;font-size:13.5px;box-shadow:var(--shadow);transition:opacity .2s;max-width:80vw;text-align:center;';
    document.body.appendChild(t);
  }
  t.textContent = message; t.style.opacity = '1';
  t.style.cursor = onClick ? 'pointer' : 'default';
  t.style.textDecoration = onClick ? 'underline' : 'none';
  t.onclick = onClick ? function(){ t.style.opacity='0'; onClick(); } : null;
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity = '0'; }, onClick ? 7000 : 2600);
}

function updateTotals(){
  if(!DRAFT) return;
  // sync all row inputs currently in DOM into DRAFT (in case of manual mode inputs not yet synced)
  document.querySelectorAll('[data-mat-idx]').forEach(inp=>{
    const idx = +inp.dataset.matIdx, field = inp.dataset.matField;
    if(DRAFT.materiales[idx]) DRAFT.materiales[idx][field] = inp.value;
  });
  document.querySelectorAll('[data-prod-idx]').forEach(inp=>{
    const idx = +inp.dataset.prodIdx, field = inp.dataset.prodField;
    if(DRAFT.productos[idx]) DRAFT.productos[idx][field] = inp.value;
  });
  // update row totals for materials
  DRAFT.materiales.forEach((m,i)=>{
    const cell = document.querySelector(`[data-mat-total="${i}"]`);
    if(cell) cell.textContent = fmtMoney((Number(m.cantidad)||0)*(Number(m.costoUnitario)||0));
  });
  // update row totals for productos
  DRAFT.productos.forEach((p,i)=>{
    const cell = document.querySelector(`[data-prod-total="${i}"]`);
    if(cell) cell.textContent = fmtMoney((Number(p.cantidad)||0)*(Number(p.precioUnitario)||0));
  });
  const calc = calcQuote(DRAFT);
  const box = document.getElementById('summary-box');
  if(box) box.innerHTML = summaryHtml(calc);
}
function attachCotizadorLiveHandlers(){
  if(VIEW.name !== 'cotizador') return;
  document.querySelectorAll('[data-mat-idx]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const idx = +inp.dataset.matIdx, field = inp.dataset.matField;
      DRAFT.materiales[idx][field] = inp.value;
      updateTotals();
    });
  });
  document.querySelectorAll('[data-prod-idx]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const idx = +inp.dataset.prodIdx, field = inp.dataset.prodField;
      DRAFT.productos[idx][field] = inp.value;
      updateTotals();
    });
  });
}

function saveQuote(){
  if(!DRAFT.clienteId){ toast('Selecciona o crea un cliente antes de guardar.'); return; }
  const productosValidos = (DRAFT.productos||[]).filter(p=>(p.nombre||'').trim()!=='');
  if(productosValidos.length===0){ toast('Agrega al menos un producto con nombre.'); return; }
  const existing = getQuote(DRAFT.id);
  if(existing){
    // Registrar cambio en el historial interno
    if(!existing.historialCambios) existing.historialCambios = [];
    const resumenAntes = quoteProductSummary(existing);
    const resumenDespues = quoteProductSummary(DRAFT);
    const cambios = [];
    if(resumenAntes!==resumenDespues) cambios.push('Productos: "'+resumenAntes+'" → "'+resumenDespues+'"');
    if(calcQuote(existing).precioVenta !== calcQuote(DRAFT).precioVenta) cambios.push('Total: '+fmtMoney(calcQuote(existing).precioVenta)+' → '+fmtMoney(calcQuote(DRAFT).precioVenta));
    if(existing.estado!==DRAFT.estado) cambios.push('Estado: '+existing.estado+' → '+DRAFT.estado);
    existing.historialCambios.push({ fecha: new Date().toISOString(), descripcion: cambios.length>0 ? cambios.join(' · ') : 'Guardado sin cambios detectados' });
    if(existing.historialCambios.length>30) existing.historialCambios = existing.historialCambios.slice(-30);
    Object.assign(existing, JSON.parse(JSON.stringify(DRAFT)));
    existing.historialCambios = JSON.parse(JSON.stringify(DRAFT.historialCambios||existing.historialCambios));
  } else {
    DRAFT.numero = nextQuoteNumber();
    DRAFT.historialCambios = [{ fecha: new Date().toISOString(), descripcion: 'Cotización creada' }];
    DB.quotes.push(JSON.parse(JSON.stringify(DRAFT)));
  }
  persist();
  toast('Cotización guardada. Ya puedes marcarla como vendida cuando quieras.');
  nav('cotizador', {id: DRAFT.id});
}
function duplicateQuote(){
  const copy = JSON.parse(JSON.stringify(DRAFT));
  copy.id = uid(); copy.numero = nextQuoteNumber(); copy.estado='cotizacion'; copy.venta=null; copy.fecha = todayStr();
  copy.historialCambios = [{ fecha: new Date().toISOString(), descripcion: 'Duplicada desde '+DRAFT.numero }];
  DB.quotes.push(copy); persist();

function saveAsignarContratistasVenta(quoteId){
  const q = getQuote(quoteId);
  if(!q) return;
  document.querySelectorAll('[data-vasig-idx]').forEach(el=>{
    const idx = +el.dataset.vasigIdx, field = el.dataset.vasigField;
    if(!q.productos[idx]) return;
    if(field==='contratistaValor') q.productos[idx][field] = Number(el.value)||0;
    else if(field==='contratistaSemana') q.productos[idx][field] = Number(el.value)||1;
    else q.productos[idx][field] = el.value;
  });
  persist();
  closeModal();
  render();
}

   ========================================================================= */
function calcFixedCosts(){
  const fc = DB.fixedCosts;
  const wk = Number(fc.weeksPerMonth)||4;
  const partners = Number(fc.partners)||1;
  fc.rows.forEach(r=> ensureRowWeeks(r, wk));
  const semanas = [];
  for(let i=0;i<wk;i++){
    const total = fc.rows.reduce((s,r)=> s + rowWeeklyValue(r, i, wk), 0);
    semanas.push({ n:i+1, total, porSocio: partners>0 ? total/partners : total });
  }
  const promedio = semanas.reduce((s,w)=>s+w.total, 0);
  const promedioPorSocio = partners>0 ? promedio/partners : promedio;
  return {promedio, promedioPorSocio, semanas, wk, partners};
}

function fixedCostDetailTotal(scale, weekNum){
  const fc = DB.fixedCosts;
  const wk = Number(fc.weeksPerMonth)||4;
  return fc.rows.reduce((s,r)=>{
    ensureRowWeeks(r, wk);
    if(scale==='week') return s + rowWeeklyValue(r, weekNum-1, wk);
    return s + Array.from({length:wk},(_,wi)=>rowWeeklyValue(r, wi, wk)).reduce((a,v)=>a+v,0);
  }, 0);
}
function fixedCostDetailModalBody(scale, weekNum){
  const fc = DB.fixedCosts;

  const partners = Number(fc.partners)||1;
  const title = scale==='week' ? ('Detalle · Semana '+weekNum) : 'Consolidado del mes';
  const subtitle = scale==='week'
    ? 'Edita el valor real de cada concepto tipo Gasto para ESTA semana (el cambio solo afecta a la semana '+weekNum+'). Los contratistas (Individual) se calculan solos desde Ventas y no se editan aquí.'
    : 'Total mensual de cada concepto (suma de sus semanas). Editar un valor de tipo Gasto aquí lo reparte en partes iguales entre las '+wk+' semanas. Los contratistas (Individual) no son editables — se calculan desde Ventas.';
  const colHeader = scale==='week' ? 'Valor de la semana' : 'Total mensual';
  const total = fixedCostDetailTotal(scale, weekNum);
  const weekArg = scale==='week' ? weekNum : '';
  return `
    <h3 style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
      <span>${esc(title)}</span>
      <button class="btn btn-brass btn-sm" onclick="addFixedCostDetailRow('${scale}', ${weekArg===''?'null':weekArg})">+ Agregar concepto</button>

    <div class="small-muted" style="margin-bottom:12px;">${esc(subtitle)}</div>

        ensureRowWeeks(r, wk);
        const isIndividual = r.tipoContrato==='individual';
        const val = scale==='week' ? rowWeeklyValue(r, weekNum-1, wk) : Array.from({length:wk},(_,wi)=>rowWeeklyValue(r, wi, wk)).reduce((a,v)=>a+v,0);
        const valueInput = isIndividual
          ? `<input type="text" value="${fmtMoney(val)}" disabled title="Calculado automáticamente desde Ventas" style="background:var(--sawdust-100); color:var(--ink-600); cursor:not-allowed;">`

        <td><button class="btn btn-ghost btn-sm btn-icon" onclick="removeFixedCostDetailRow(${i}, '${scale}', ${weekArg===''?'null':weekArg})">✕</button></td>
      </tr>`;}).join('')}
      ${fc.rows.length===0 ? `<tr><td colspan="4" class="small-muted" style="padding:10px 0;">Sin conceptos aún. Usa "+ Agregar concepto".</td></tr>` : ''}

function updateFixedCostDetailConcepto(idx, value){
  if(!DB.fixedCosts.rows[idx]) return;
  DB.fixedCosts.rows[idx].concepto = value;
  persist();
}
function addFixedCostDetailRow(scale, weekNum){
  const wk = Number(DB.fixedCosts.weeksPerMonth)||4;
  DB.fixedCosts.rows.push({id:uid(), concepto:'', tipoContrato:'gasto', valoresSemanales: Array(wk).fill(0)});
  persist();
  refreshFixedCostsCards();
  showModal(fixedCostDetailModalBody(scale, weekNum));
}
function removeFixedCostDetailRow(idx, scale, weekNum){
  DB.fixedCosts.rows.splice(idx,1);
  persist();
  refreshFixedCostsCards();
  showModal(fixedCostDetailModalBody(scale, weekNum));
}
function updateFixedCostDetailValue(inputEl){
  const idx = +inputEl.dataset.fcDetailIdx;
  const scale = inputEl.dataset.fcDetailScale;
  const weekNum = inputEl.dataset.fcDetailWeek ? +inputEl.dataset.fcDetailWeek : null;
  const fc = DB.fixedCosts;
  const wk = Number(fc.weeksPerMonth)||4;
  const row = fc.rows[idx];
  if(row.tipoContrato==='individual') return; // no editable: se calcula desde Ventas
  ensureRowWeeks(row, wk);
  const newVal = Number(inputEl.value)||0;
  if(scale==='week'){
    row.valoresSemanales[weekNum-1] = newVal;
  } else {
    const per = newVal / wk;
    row.valoresSemanales = Array(wk).fill(per);
  }
  const total = fixedCostDetailTotal(scale, weekNum);
  const partners = Number(fc.partners)||1;
  const totalEl = document.getElementById('fc-detail-total'); if(totalEl) totalEl.textContent = fmtMoney(total);
  const socioEl = document.getElementById('fc-detail-total-socio'); if(socioEl) socioEl.textContent = fmtMoney(partners>0 ? total/partners : total);
  refreshFixedCostsCards();
  persist();
}

  showModal(fixedCostDetailModalBody('week', weekNum));
}
function showFixedCostMonthDetail(){
  showModal(fixedCostDetailModalBody('month'));
}
function fixedCostRowHtml(r,i,wk){
  ensureRowWeeks(r, wk);
  const isIndividual = r.tipoContrato==='individual';
  const total = Array.from({length:wk},(_,wi)=>rowWeeklyValue(r, wi, wk)).reduce((s,v)=>s+v,0);
  const weekCells = Array.from({length:wk},(_,wi)=>{
    const v = rowWeeklyValue(r, wi, wk);
    if(isIndividual){
      return `<td style="width:110px"><input type="text" value="${fmtMoney(v)}" data-fc-idx="${i}" data-fc-week="${wi}" disabled title="Calculado automáticamente desde Ventas" style="background:var(--sawdust-100); color:var(--ink-600); cursor:not-allowed;"></td>`;
    }
    return `<td style="width:110px"><input type="number" value="${v}" data-fc-field="semana" data-fc-idx="${i}" data-fc-week="${wi}"></td>`;
  }).join('');
  return `<tr data-fc-row="${i}">
    <td><input type="text" value="${esc(r.concepto)}" data-fc-field="concepto" data-fc-idx="${i}"></td>
    <td style="width:130px"><select data-fc-field="tipoContrato" data-fc-idx="${i}" onchange="updateFixedCostTipoContrato(${i}, this.value)">
      <option value="gasto" ${!isIndividual?'selected':''}>Gasto</option>
      <option value="individual" ${isIndividual?'selected':''}>Individual</option>
    </select></td>
    ${weekCells}
    <td class="mat-total-cell" data-fc-prom="${i}">${fmtMoney(total)}</td>
    <td><div class="icon-btn-row">
      ${isIndividual ? '' : `<button class="btn btn-ghost btn-sm btn-icon" title="Copiar el valor de la semana 1 a todas las semanas" onclick="applySameValueAllWeeks(${i})">⇉</button>`}
      <button class="btn btn-ghost btn-sm btn-icon" onclick="removeFixedCostRow(${i})">✕</button>
    </div></td>
  </tr>`;
}
function updateFixedCostTipoContrato(i, value){
  if(!DB.fixedCosts.rows[i]) return;
  DB.fixedCosts.rows[i].tipoContrato = value;
  persist();
  render();
}
function applySameValueAllWeeks(i){
  const fc = DB.fixedCosts;
  const wk = Number(fc.weeksPerMonth)||4;
  const row = fc.rows[i];
  ensureRowWeeks(row, wk);
  const v = Number(row.valoresSemanales[0])||0;
  row.valoresSemanales = Array(wk).fill(v);
  persist();
  render();
}
function addFixedCostRow(){
  const wk = Number(DB.fixedCosts.weeksPerMonth)||4;
  DB.fixedCosts.rows.push({id:uid(), concepto:'', tipoContrato:'gasto', valoresSemanales: Array(wk).fill(0)});
  persist(); render();
}
function removeFixedCostRow(i){ DB.fixedCosts.rows.splice(i,1); persist(); render(); }
function refreshFixedCostsCards(){
  if(VIEW.name==='costosfijos'){
    const currentRowCount = document.querySelectorAll('[data-fc-row]').length;
    if(currentRowCount !== DB.fixedCosts.rows.length){ render(); return; }
  }
  const calc = calcFixedCosts();
  calc.semanas.forEach(s=>{
    const t = document.getElementById('fc-semana-'+s.n); if(t) t.textContent = fmtMoney(s.total);
    const p = document.getElementById('fc-semana-socio-'+s.n); if(p) p.textContent = fmtMoney(s.porSocio);
  });
  const tp = document.getElementById('fc-total-promedio'); if(tp) tp.textContent = fmtMoney(calc.promedio);
  const sp = document.getElementById('fc-socio-promedio'); if(sp) sp.textContent = fmtMoney(calc.promedioPorSocio);
  const cm = document.getElementById('fc-consolidado-mes'); if(cm) cm.textContent = fmtMoney(calc.promedio);
  const cms = document.getElementById('fc-consolidado-mes-socio'); if(cms) cms.textContent = fmtMoney(calc.promedioPorSocio);
  const wk = Number(DB.fixedCosts.weeksPerMonth)||4;
  DB.fixedCosts.rows.forEach((r,i)=>{
    ensureRowWeeks(r, wk);
    const isIndividual = r.tipoContrato==='individual';
    const total = Array.from({length:wk},(_,wi)=>rowWeeklyValue(r, wi, wk)).reduce((s,v)=>s+v,0);
    const cell = document.querySelector(`[data-fc-prom="${i}"]`);
    if(cell) cell.textContent = fmtMoney(total);
    for(let wi=0; wi<wk; wi++){
      const v = rowWeeklyValue(r, wi, wk);
      const inp = document.querySelector(`input[data-fc-idx="${i}"][data-fc-week="${wi}"]`);
      if(inp && document.activeElement!==inp) inp.value = isIndividual ? fmtMoney(v) : v;
    }
  });
}
function updateFixedCostsSummary(){
  document.querySelectorAll('[data-fc-idx][data-fc-field="concepto"]').forEach(inp=>{
    const idx = +inp.dataset.fcIdx;
    if(DB.fixedCosts.rows[idx]) DB.fixedCosts.rows[idx].concepto = inp.value;
  });
  document.querySelectorAll('[data-fc-idx][data-fc-week]').forEach(inp=>{
    const idx = +inp.dataset.fcIdx, wi = +inp.dataset.fcWeek;
    if(DB.fixedCosts.rows[idx] && DB.fixedCosts.rows[idx].tipoContrato!=='individual'){
      DB.fixedCosts.rows[idx].valoresSemanales[wi] = Number(inp.value)||0;
    }
  });
  refreshFixedCostsCards();
  persist();
}
function attachFixedCostsLiveHandlers(){
  if(VIEW.name !== 'costosfijos') return;
  document.querySelectorAll('[data-fc-idx]').forEach(inp=>{
    if(inp.disabled) return;
    inp.addEventListener('input', ()=>{
      const idx = +inp.dataset.fcIdx;
      if(inp.dataset.fcWeek !== undefined && inp.dataset.fcField==='semana'){
        const wi = +inp.dataset.fcWeek;
        DB.fixedCosts.rows[idx].valoresSemanales[wi] = Number(inp.value)||0;
      } else if(inp.dataset.fcField==='concepto'){
        DB.fixedCosts.rows[idx].concepto = inp.value;
      }
      updateFixedCostsSummary();
    });
  });
}

function viewContratistas(){
  const fc = DB.fixedCosts;
  const wk = Number(fc.weeksPerMonth)||4;
  const nombres = getContratistaNombres();
  const filtroSemana = VIEW.params.semana || '';
  const filtroNombre = VIEW.params.nombre || '';
  if(nombres.length===0){
    return `
    <div class="page-head"><div><h1 class="page-title">Control de contratistas</h1><div class="page-sub">Uso interno — esta información nunca aparece en los documentos del cliente</div></div></div>
    <div class="card pad">${emptyState('◐','Aún no tienes contratistas marcados. Ve a Costos fijos y marca un concepto como "Individual" en la columna Contrato.')}</div>`;
  }
  const asignaciones = [];
  DB.quotes.forEach(q=>{
    (q.productos||[]).forEach(p=>{
      if((p.contratista||'').trim()!=='') asignaciones.push({ quote:q, item:p });
    });
  });

  const nombresFiltrados = filtroNombre ? nombres.filter(n=>n===filtroNombre) : nombres;
  const asigFiltradas = asignaciones.filter(a=>{
    if(filtroNombre && (a.item.contratista||'').toLowerCase()!==filtroNombre.toLowerCase()) return false;
    if(filtroSemana && String(a.item.contratistaSemana)!==filtroSemana) return false;
    return true;
  });

  const totalPendiente = asigFiltradas.filter(a=>(a.item.estadoPagoContratista||'pendiente')==='pendiente').reduce((s,a)=>s+(Number(a.item.contratistaValor)||0),0);
  const totalPagado = asigFiltradas.filter(a=>(a.item.estadoPagoContratista||'')==='pagado').reduce((s,a)=>s+(Number(a.item.contratistaValor)||0),0);

  return `
  <div class="page-head">
    <div><h1 class="page-title">Control de contratistas</h1><div class="page-sub">Uso interno — esta información nunca aparece en los documentos del cliente.</div></div>
    <button class="btn btn-ghost" onclick="exportContratistasXLSX()">⬇ Exportar a Excel</button>
  </div>
  <div class="card pad" style="margin-bottom:18px;">
    <div class="row-flex" style="gap:12px; flex-wrap:wrap; align-items:flex-end;">
      <div class="field" style="max-width:200px;"><label>Filtrar por contratista</label>
        <select onchange="nav('contratistas',Object.assign({},VIEW.params,{nombre:this.value}))">
          <option value="">Todos</option>
          ${nombres.map(n=>`<option value="${esc(n)}" ${filtroNombre===n?'selected':''}>${esc(n)}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="max-width:160px;"><label>Filtrar por semana</label>
        <select onchange="nav('contratistas',Object.assign({},VIEW.params,{semana:this.value}))">
          <option value="">Todas las semanas</option>
          ${Array.from({length:wk},(_,i)=>`<option value="${i+1}" ${filtroSemana===String(i+1)?'selected':''}>Semana ${i+1}</option>`).join('')}
        </select>
      </div>
      <div class="kpi" style="flex:1; min-width:160px; padding:12px 16px; background:var(--rust-100); border-radius:var(--radius);">
        <div class="kpi-label">Total pendiente de pago</div>
        <div class="kpi-value" style="font-size:20px; color:var(--rust-600);">${fmtMoney(totalPendiente)}</div>
      </div>
      <div class="kpi" style="flex:1; min-width:160px; padding:12px 16px; background:var(--forest-100); border-radius:var(--radius);">
        <div class="kpi-label">Total pagado</div>
        <div class="kpi-value" style="font-size:20px; color:var(--forest-600);">${fmtMoney(totalPagado)}</div>
      </div>
    </div>
  </div>

  ${nombresFiltrados.map(nombre=>{
    const propios = asignaciones.filter(a=>{
      if((a.item.contratista||'').trim().toLowerCase()!==nombre.toLowerCase()) return false;
      if(filtroSemana && String(a.item.contratistaSemana)!==filtroSemana) return false;
      return true;
    });
    const totalGeneral = propios.reduce((s,a)=>s+(Number(a.item.contratistaValor)||0),0);
    const pendiente = propios.filter(a=>(a.item.estadoPagoContratista||'pendiente')==='pendiente').reduce((s,a)=>s+(Number(a.item.contratistaValor)||0),0);
    const pagado = propios.filter(a=>(a.item.estadoPagoContratista||'')==='pagado').reduce((s,a)=>s+(Number(a.item.contratistaValor)||0),0);
    const porSemana = Array.from({length:wk},(_,i)=> {
      const sem = asignaciones.filter(a=>(a.item.contratista||'').trim().toLowerCase()===nombre.toLowerCase() && Number(a.item.contratistaSemana)===i+1);
      return { total: sem.reduce((s,a)=>s+(Number(a.item.contratistaValor)||0),0), pendiente: sem.filter(a=>(a.item.estadoPagoContratista||'pendiente')==='pendiente').reduce((s,a)=>s+(Number(a.item.contratistaValor)||0),0) };
    });
    return `
    <div class="card pad" style="margin-bottom:18px;">
      <div class="section-title">${esc(nombre)}
        <div style="display:flex; gap:8px; align-items:center;">
          <span class="badge badge-cancel">${fmtMoney(pendiente)} pendiente</span>
          <span class="badge badge-ok">${fmtMoney(pagado)} pagado</span>
          <span class="shop-tag">${fmtMoney(totalGeneral)} total</span>
        </div>
      </div>
      ${!filtroSemana ? `<div class="row-flex" style="margin-bottom:12px;">
        ${porSemana.map((s,i)=>`<div class="card kpi" style="flex:1; min-width:110px; cursor:pointer;" onclick="nav('contratistas',Object.assign({},VIEW.params,{semana:'${i+1}'}))">
          <div class="kpi-accent" style="background:${s.pendiente>0?'var(--rust-600)':'var(--forest-600)'}"></div>
          <div class="kpi-label">Semana ${i+1}</div>
          <div class="kpi-value" style="font-size:16px;">${fmtMoney(s.total)}</div>
          ${s.pendiente>0?`<div class="small-muted" style="color:var(--rust-600); margin-top:2px;">${fmtMoney(s.pendiente)} pend.</div>`:`<div class="small-muted" style="color:var(--forest-600); margin-top:2px;">Pagado</div>`}
        </div>`).join('')}
      </div>` : ''}
      ${propios.length===0 ? `<div class="small-muted">Sin muebles asignados en este filtro.</div>` : `
      <div class="table-wrap"><table>
        <tr><th>Semana</th><th>Cliente</th><th>Mueble</th><th>Valor</th><th>Estado pago</th></tr>
        ${propios.sort((a,b)=>(Number(a.item.contratistaSemana)||0)-(Number(b.item.contratistaSemana)||0)).map(a=>{
          const c = getClient(a.quote.clienteId);
          const pagado = (a.item.estadoPagoContratista||'pendiente')==='pagado';
          return `<tr class="row-hover">
            <td>Semana ${a.item.contratistaSemana||1}</td>
            <td style="cursor:pointer" onclick="nav('cotizador',{id:'${a.quote.id}'})">${esc(c?c.nombre:'—')}</td>
            <td style="cursor:pointer" onclick="nav('cotizador',{id:'${a.quote.id}'})">${esc(a.item.nombre)}</td>
            <td class="mono">${fmtMoney(a.item.contratistaValor)}</td>
            <td><select onchange="updateEstadoPagoContratista('${a.quote.id}','${a.item.id}',this.value)">
              <option value="pendiente" ${!pagado?'selected':''}>Pendiente</option>
              <option value="pagado" ${pagado?'selected':''}>Pagado</option>
            </select></td>
          </tr>`;
        }).join('')}
      </table></div>`}
    </div>`;
  }).join('')}
  `;
}
function updateEstadoPagoContratista(quoteId, itemId, value){
  const q = getQuote(quoteId);
  if(!q) return;
  const p = (q.productos||[]).find(p=>p.id===itemId);
  if(!p) return;
  p.estadoPagoContratista = value;
  persist();
  render();
}
async function exportContratistasXLSX(){
  if(!checkExcelLib()) return;
  const columns = [
    {header:'Contratista', key:'contratista', width:20},
    {header:'Semana', key:'semana', width:12},
    {header:'Cliente', key:'cliente', width:26},
    {header:'Mueble / Producto', key:'mueble', width:30},
    {header:'Valor', key:'valor', width:16, money:true},
    {header:'Estado de pago', key:'estado', width:16},
    {header:'N° Cotización', key:'numero', width:18},
  ];
  const rows = [];
  const nombres = getContratistaNombres();
  nombres.forEach(nombre=>{
    DB.quotes.forEach(q=>{
      (q.productos||[]).forEach(p=>{
        if((p.contratista||'').trim().toLowerCase()===nombre.toLowerCase()){
          const c = getClient(q.clienteId);
          rows.push({ contratista: nombre, semana: 'Semana '+(p.contratistaSemana||1), cliente: c?c.nombre:'', mueble: p.nombre||'', valor: Number(p.contratistaValor)||0, estado: (p.estadoPagoContratista||'pendiente')==='pagado'?'Pagado':'Pendiente', numero: docDisplayNumber('COT', q.numero) });
        }
      });
    });
  });
  rows.sort((a,b)=> (a.contratista+a.semana).localeCompare(b.contratista+b.semana));
  const wb = await buildStyledWorkbook('Control de Contratistas', columns, rows);
  await downloadWorkbook(wb, 'JUMANAR_Contratistas_'+todayStr()+'.xlsx');
}

function viewHistorial(){
  const term = VIEW.params.q || '';
  let results = {clients:[], quotes:[], ops:[], contratistas:[]};
  if(term.trim().length>0){
    const s = term.toLowerCase();
    results.clients = DB.clients.filter(c=> (c.nombre||'').toLowerCase().includes(s) || (c.telefono||'').includes(s));
    results.quotes = DB.quotes.filter(q=> (q.numero||'').toLowerCase().includes(s) || quoteProductSummary(q).toLowerCase().includes(s) || (q.fecha||'').includes(s));
    results.ops = DB.productionOrders.filter(o=> (o.numero||'').toLowerCase().includes(s));
    DB.quotes.forEach(q=>{
      (q.productos||[]).forEach(p=>{
        if((p.contratista||'').toLowerCase().includes(s) && p.contratista.trim()!==''){
          const c = getClient(q.clienteId);
          if(!results.contratistas.find(r=>r.quoteId===q.id && r.itemId===p.id)){
            results.contratistas.push({ quoteId:q.id, itemId:p.id, contratista:p.contratista, mueble:p.nombre, cliente:c?c.nombre:'', numero:q.numero });
          }
        }
      });
    });
  }
  const hasSearch = term.trim().length>0;
  return `
  <div class="page-head"><div><h1 class="page-title">Historial</h1><div class="page-sub">Busca por cliente, producto, fecha, N° de cotización, orden de producción o contratista</div></div></div>
  <div class="card pad">
    <div class="searchbox" style="max-width:420px; margin-bottom:18px;">
      <input type="text" placeholder="Escribe para buscar en todo el sistema..." value="${esc(term)}" oninput="nav('historial',{q:this.value})">
    </div>
    ${!hasSearch? emptyState('⌕','Escribe algo para buscar en clientes, cotizaciones, órdenes o contratistas.') : `
      ${results.clients.length>0? `<div class="section-title">Clientes</div>${results.clients.map(c=>`<div class="row-hover" style="padding:8px; cursor:pointer" onclick="nav('clientes',{detail:'${c.id}'})">${esc(c.nombre)} — ${esc(c.telefono||'')}</div>`).join('')}<div class="divider"></div>`:''}
      ${results.quotes.length>0? `<div class="section-title">Cotizaciones / Ventas</div>${results.quotes.map(q=>{const c=getClient(q.clienteId);return `<div class="row-hover" style="padding:8px; cursor:pointer" onclick="nav('cotizador',{id:'${q.id}'})"><span class="shop-tag">${q.numero}</span> ${esc(quoteProductSummary(q))} — ${esc(c?c.nombre:'')} (${fmtDate(q.fecha)})</div>`;}).join('')}<div class="divider"></div>`:''}
      ${results.ops.length>0? `<div class="section-title">Órdenes de producción</div>${results.ops.map(o=>`<div class="row-hover" style="padding:8px; cursor:pointer" onclick="nav('cotizador',{id:'${o.quoteId}'})"><span class="shop-tag">${o.numero}</span> ${OP_LABELS[o.estado]}</div>`).join('')}<div class="divider"></div>`:''}
      ${results.contratistas.length>0? `<div class="section-title">Resultados por contratista</div>${results.contratistas.map(r=>`<div class="row-hover" style="padding:8px; cursor:pointer" onclick="nav('cotizador',{id:'${r.quoteId}'})"><span class="shop-tag">${esc(r.numero)}</span> <b>${esc(r.contratista)}</b> — ${esc(r.mueble)} (${esc(r.cliente)})</div>`).join('')}<div class="divider"></div>`:''}
      ${(results.clients.length+results.quotes.length+results.ops.length+results.contratistas.length)===0? emptyState('⌕','Sin resultados.') : ''}
    `}
  </div>`;
}

  </div>`;
}

/* =========================================================================
   EXPORTAR DATOS — Excel (.xlsx) con identidad visual JUMANAR aplicada
   ========================================================================= */
async function buildStyledWorkbook(sheetTitle, columns, rows){
  const wb = new ExcelJS.Workbook();
  wb.creator = 'JUMANAR';
  wb.created = new Date();
  const ws = wb.addWorksheet(sheetTitle.slice(0,31));
  const colCount = columns.length;

  ws.mergeCells(1,1,1,colCount);
  const brandCell = ws.getCell(1,1);
  brandCell.value = 'JUMANAR';
  brandCell.font = { name:'Arial', bold:true, size:16, color:{argb:'FFF6F3EC'} };
  brandCell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF1F4D4D'} };
  brandCell.alignment = { vertical:'middle', horizontal:'left', indent:1 };
  ws.getRow(1).height = 28;

  ws.mergeCells(2,1,2,colCount);
  const subCell = ws.getCell(2,1);
  subCell.value = sheetTitle + '  ·  Generado el ' + new Date().toLocaleDateString('es-CO');
  subCell.font = { name:'Arial', italic:true, size:10, color:{argb:'FF7B7062'} };
  subCell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFF6F3EC'} };
  subCell.alignment = { vertical:'middle', horizontal:'left', indent:1 };
  ws.getRow(2).height = 18;

  ws.getRow(3).height = 6;

  const headerRowIdx = 4;
  const headerRow = ws.getRow(headerRowIdx);
  columns.forEach((c,i)=>{
    const cell = headerRow.getCell(i+1);
    cell.value = c.header;
    cell.font = { name:'Arial', bold:true, size:10, color:{argb:'FF1F4D4D'} };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFA7B897'} };
    cell.alignment = { vertical:'middle', horizontal:'left' };
    cell.border = { bottom:{style:'thin', color:{argb:'FF1F4D4D'}} };
  });
  headerRow.height = 20;

  rows.forEach((r, ri)=>{
    const row = ws.getRow(headerRowIdx+1+ri);
    columns.forEach((c,ci)=>{
      const cell = row.getCell(ci+1);
      cell.value = r[c.key] === undefined ? '' : r[c.key];
      cell.font = { name:'Arial', size:10, color:{argb:'FF20302D'} };
      if(c.money){ cell.numFmt = '$#,##0'; cell.alignment = { horizontal:'right' }; }
      cell.border = { bottom:{style:'hair', color:{argb:'FFE3DACB'}} };
      if(ri % 2 === 1){ cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFFBFAF6'} }; }
    });
  });

  columns.forEach((c,i)=>{ ws.getColumn(i+1).width = c.width || 18; });
  return wb;
}
async function downloadWorkbook(wb, filename){
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function checkExcelLib(){
  if(typeof ExcelJS === 'undefined'){ toast('No se pudo cargar el generador de Excel. Revisa tu conexión e intenta de nuevo.'); return false; }
  return true;
}

async function exportCostosFijosXLSX(){
  if(!checkExcelLib()) return;
  const calc = calcFixedCosts();
  const columns = [
    {header:'', key:'etiqueta', width:16},
    ...calc.semanas.map(s=>({header:'Semana '+s.n, key:'semana'+s.n, width:16, money:true})),
    {header:'Consolidado del mes', key:'mes', width:20, money:true},
  ];
  const filaTotal = { etiqueta: 'Total' };
  const filaSocio = { etiqueta: 'Por socio ('+calc.partners+')' };
  calc.semanas.forEach(s=>{ filaTotal['semana'+s.n] = s.total; filaSocio['semana'+s.n] = s.porSocio; });
  filaTotal.mes = calc.promedio;
  filaSocio.mes = calc.promedioPorSocio;
  const rows = [filaTotal, filaSocio];
  const wb = await buildStyledWorkbook('Costos Fijos', columns, rows);
  await downloadWorkbook(wb, 'JUMANAR_CostosFijos_'+todayStr()+'.xlsx');
}
